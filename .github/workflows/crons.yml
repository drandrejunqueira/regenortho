# Crons que rodam mais de uma vez por dia.
#
# O plano Hobby da Vercel só aceita cron diário: com `0 * * * *` e `*/15 * * * *`
# no vercel.json todo deploy era recusado desde a v1.4.0 e a produção ficou
# parada na v1.2.2. O vercel.json guarda só os diários; estes rodam daqui.
#
# Precisa de dois secrets no repositório (Settings → Secrets → Actions):
#   APP_URL      URL de produção, sem barra no fim (ex.: https://app.exemplo.com.br)
#   CRON_SECRET  o mesmo valor da env CRON_SECRET na Vercel
# Sem eles o job só avisa e sai com sucesso.
name: Crons frequentes

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: crons
  cancel-in-progress: false

jobs:
  disparar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Chamar rotas de cron
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::notice::APP_URL ou CRON_SECRET não configurados — nada a disparar."
            exit 0
          fi
          chamar() {
            echo "→ $1"
            curl --fail-with-body --silent --show-error --max-time 60 \
              -H "Authorization: Bearer $CRON_SECRET" "$APP_URL$1"
            echo
          }
          # SLA: lead parado em "new" há mais de 15 min avisa a recepção.
          chamar /api/cron/leads-sla
          # Agenda do dia: envia a quem já passou do horário configurado no
          # perfil; a rota deduplica por dia, então chamar a cada 15 min é seguro.
          chamar /api/cron/agenda-medicos
